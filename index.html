<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="SastiTripsWale is a verified travel community. Discover, host or join bike, car & backpacking trips, split expenses fairly, and connect with fellow travelers safely with Couples, girls-only or boys-only modes. Free sign-up."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://sastitripswale.com/" />
    <meta name="theme-color" content="#0a1220" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/pwa/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SastiTripsWale" />
    <title>SastiTripsWale - Travel Community | Discover, Host & Join Trips</title>

    <meta property="og:site_name" content="SastiTripsWale" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SastiTripsWale - Travel Community" />
    <meta
      property="og:description"
      content="Discover, host or join bike, car & backpacking trips, split expenses fairly, and connect with fellow travelers safely in verified groups. Couples, girls-only & boys-only modes. Free sign-up."
    />
    <meta property="og:url" content="https://sastitripswale.com/" />
    <meta property="og:image" content="https://sastitripswale.com/pwa/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SastiTripsWale - Travel Community" />
    <meta
      name="twitter:description"
      content="Discover, host or join bike, car & backpacking trips, split expenses fairly, and connect with fellow travelers safely in verified groups."
    />
    <meta name="twitter:image" content="https://sastitripswale.com/pwa/icon-512.png" />
    <script>
      // Apply the persisted theme before first paint (avoids a flash of the
      // wrong theme). Dark is the default when nothing is stored yet.
      (function () {
        try {
          var raw = localStorage.getItem('stw-theme');
          var theme = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme;
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
      // Apply the persisted app language before first paint - only matters
      // for Urdu, which flips the page to rtl. English (India) is default.
      (function () {
        try {
          var raw = localStorage.getItem('stw-language');
          var lang = raw && JSON.parse(raw).state && JSON.parse(raw).state.language;
          if (lang) {
            document.documentElement.setAttribute('lang', lang);
            if (lang === 'ur-IN') document.documentElement.setAttribute('dir', 'rtl');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
